# Render blueprint — "Apply" this repo and Render provisions everything:
#   * a free PostgreSQL instance (DATABASE_URL is injected automatically)
#   * a Node web service that builds the React app and serves it with the API
#
# You can ignore this file and click through the dashboard instead — the
# manual steps are in README.md § Deploying to Render.
services:
  - type: web
    name: secure-dms
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Injected from the Postgres instance declared below — without this
      # `fromDatabase` binding the variable never appears and boot fails with
      # "SASL: client password must be a string".
      - key: DATABASE_URL
        fromDatabase:
          name: secure-dms-db
          property: connectionString
      # Create tables on boot and load the demo accounts when the DB is empty.
      # Set AUTO_SEED to false once you have real data.
      - key: AUTO_INIT_DB
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: secure-dms-db
    plan: free
    databaseName: sdms
